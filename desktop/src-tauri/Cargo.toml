[package]
name = "creator-source-importer"
version = "0.7.0"
description = "Local media transcription and Markdown export"
edition = "2021"

[[bin]]
name = "creator-source-importer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
